<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VOID RUN — jxpix</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090912;color:#dfdcef;font:14px ui-monospace,SFMono-Regular,Consolas,monospace;min-height:100vh;display:grid;place-items:center;padding:18px}.wrap{width:min(100%,760px)}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}h1{font-size:clamp(24px,5vw,42px);letter-spacing:.12em;margin:0;color:#f2edff}header p{color:#9892b3;margin:7px 0 0}a{color:#aa9acb;text-decoration:none}a:hover{color:white}.frame{position:relative;border:1px solid #514570;background:#100d1d;box-shadow:0 0 50px #6c479e22;border-radius:6px;overflow:hidden}canvas{width:100%;display:block;touch-action:none} .panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#0a0915d9;padding:20px}.panel[hidden]{display:none}.panel h2{font-size:28px;letter-spacing:.15em;margin:0 0 12px}.panel p{line-height:1.7;color:#b2a9c8;margin:0 0 20px}button{font:inherit;background:#b59ae6;color:#100d1a;border:0;border-radius:3px;padding:12px 26px;cursor:pointer;font-weight:bold;letter-spacing:.08em}button:hover{background:#d5c1ff}.controls{display:flex;justify-content:space-between;gap:10px;color:#9a90ad;margin-top:13px;line-height:1.6}.touch{display:none;gap:8px;margin-top:12px}.touch button{flex:1;background:#211a32;color:#e4d5ff;border:1px solid #504368;font-size:19px;touch-action:none}@media(hover:none),(pointer:coarse){.touch{display:flex}}
</style></head><body><main class="wrap"><header><div><h1>VOID RUN</h1><p>avoid the fragments · survive the signal</p></div><a href="https://github.com/ryzhenkahvh">↗ GitHub</a></header><div class="frame"><canvas id="game" width="720" height="420" aria-label="Dodge the falling obstacles using arrow keys or on-screen buttons"></canvas><div class="panel" id="panel"><h2 id="heading">VOID RUN</h2><p id="message">Move left and right. Dodge the falling fragments.<br>Survive as long as you can.</p><button id="start">START GAME</button></div></div><div class="controls"><span>← → or A / D to move · P to pause</span><span id="record">BEST 0000</span></div><div class="touch"><button id="left" aria-label="Move left">←</button><button id="right" aria-label="Move right">→</button></div></main><script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),panel=document.getElementById('panel'),heading=document.getElementById('heading'),msg=document.getElementById('message'),start=document.getElementById('start'),record=document.getElementById('record');let state='ready',player,objects=[],stars=[],keys={left:false,right:false},score=0,elapsed=0,spawn=0,last=0,best=0;try{best=Number(localStorage.getItem('void-run-best'))||0}catch(e){}function updateBest(){record.textContent='BEST '+String(best).padStart(4,'0')}updateBest();for(let i=0;i<60;i++)stars.push({x:Math.random()*720,y:Math.random()*420,r:Math.random()*1.5+.3,v:Math.random()*25+8});function reset(){player={x:360,y:365,w:27,h:25};objects=[];score=0;elapsed=0;spawn=0;last=0;keys.left=keys.right=false;state='playing';panel.hidden=true;requestAnimationFrame(loop)}function end(){state='over';best=Math.max(best,Math.floor(score));try{localStorage.setItem('void-run-best',best)}catch(e){}updateBest();heading.textContent='SIGNAL LOST';msg.innerHTML='SCORE '+String(Math.floor(score)).padStart(4,'0')+'<br>BEST '+String(best).padStart(4,'0');start.textContent='PLAY AGAIN';panel.hidden=false}function loop(t){if(state!=='playing')return;let dt=last?Math.min((t-last)/1000,.035):0;last=t;elapsed+=dt;score+=dt*10;ctx.fillStyle='#100d1d';ctx.fillRect(0,0,720,420);for(const s of stars){s.y+=s.v*dt;if(s.y>420){s.y=0;s.x=Math.random()*720}ctx.fillStyle='#a998c8';ctx.globalAlpha=.45;ctx.fillRect(s.x,s.y,s.r,s.r);ctx.globalAlpha=1}ctx.strokeStyle='#44365e';ctx.beginPath();ctx.moveTo(0,398);ctx.lineTo(720,398);ctx.stroke();player.x+=(Number(keys.right)-Number(keys.left))*310*dt;player.x=Math.max(16,Math.min(704,player.x));spawn-=dt;if(spawn<=0){let size=13+Math.random()*18;objects.push({x:20+Math.random()*680,y:-40,size,speed:100+Math.random()*85+Math.min(elapsed*4,160),spin:Math.random()*6,rot:(Math.random()-.5)*3});spawn=Math.max(.19,.65-elapsed*.009)+Math.random()*.2}for(let i=objects.length-1;i>=0;i--){let o=objects[i];o.y+=o.speed*dt;o.spin+=o.rot*dt;ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.spin);ctx.strokeStyle='#e090c4';ctx.lineWidth=2;ctx.fillStyle='#49264f';ctx.beginPath();ctx.moveTo(0,-o.size);ctx.lineTo(o.size*.7,0);ctx.lineTo(0,o.size);ctx.lineTo(-o.size*.7,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();if(Math.abs(player.x-o.x)<o.size*.55+9&&Math.abs(player.y-o.y)<o.size*.7+9){end();return}if(o.y>460)objects.splice(i,1)}ctx.save();ctx.translate(player.x,player.y);ctx.shadowBlur=18;ctx.shadowColor='#b49aff';ctx.fillStyle='#e5dbff';ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(13,12);ctx.lineTo(0,6);ctx.lineTo(-13,12);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle='#cbbce7';ctx.font='14px monospace';ctx.fillText('SCORE '+String(Math.floor(score)).padStart(4,'0'),20,28);requestAnimationFrame(loop)}function pause(){if(state==='playing'){state='paused';heading.textContent='PAUSED';msg.textContent='Take your time.';start.textContent='RESUME';panel.hidden=false}else if(state==='paused'){state='playing';panel.hidden=true;last=0;requestAnimationFrame(loop)}}start.onclick=()=>{if(state==='paused')pause();else reset()};document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key.toLowerCase()==='p'&&!e.repeat)pause()});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});window.addEventListener('blur',()=>{keys.left=keys.right=false;if(state==='playing')pause()});for(const [id,dir] of [['left','left'],['right','right']]){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[dir]=true});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>keys[dir]=false)}ctx.fillStyle='#100d1d';ctx.fillRect(0,0,720,420)})();
</script></body></html>
