# Ложится в профильный репозиторий как .github/workflows/update-stats.yml
# Обновляет stats.svg и langs.svg автоматически: раз в 6 часов и кнопкой "Run workflow".
name: Update GitHub stats

on:
  schedule:
    - cron: '15 */6 * * *'   # каждые 6 часов
  workflow_dispatch:          # ручной запуск во вкладке Actions

permissions:
  contents: write             # разрешение на коммит

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate stats.svg and langs.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg langs.svg
          git diff --cached --quiet || git commit -m "chore: update stats [skip ci]"
          git push
